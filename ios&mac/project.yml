name: ApexLocation
options:
  bundleIdPrefix: com.lukeeidson
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
settings:
  base:
    DEVELOPMENT_TEAM: RFWSBR75SU  # Luke Eidson (Personal Team)
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.10"
targets:
  ApexLocation:
    type: application
    platform: iOS
    supportedDestinations: [iOS]
    sources:
      - path: ApexLocation
      - path: Shared
      - path: Resources/DDI
        type: folder
        buildPhase: resources
    info:
      path: ApexLocation/Info.plist
      properties:
        CFBundleDisplayName: Apex Location
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSLocalNetworkUsageDescription: Talks to this iPhone's own developer services through LocalDevVPN to change its location.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lukeeidson.apexlocation
        SWIFT_OBJC_BRIDGING_HEADER: ApexLocation/Bridging-Header.h
        HEADER_SEARCH_PATHS: $(SRCROOT)/../apex-core/include
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/../apex-core/target/aarch64-apple-ios/release
        OTHER_LDFLAGS: [-lapex_core, -framework, Security, -framework, SystemConfiguration]
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ARCHS: arm64
        SUPPORTED_PLATFORMS: iphoneos
    preBuildScripts:
      - name: Build apex-core (Rust)
        basedOnDependencyAnalysis: false
        script: |
          export PATH="/opt/homebrew/opt/rustup/bin:$HOME/.cargo/bin:$PATH"
          cd "$SRCROOT/../apex-core"
          IPHONEOS_DEPLOYMENT_TARGET=17.0 cargo build --release --lib --target aarch64-apple-ios

  ApexLocationMac:
    type: application
    platform: macOS
    sources:
      - path: Mac
      - path: Shared
      - path: Resources/DDI
        type: folder
        buildPhase: resources
    info:
      path: Mac/Info.plist
      properties:
        CFBundleDisplayName: Apex Location Director
        CFBundleName: Apex Location Director
        LSApplicationCategoryType: public.app-category.utilities
    settings:
      base:
        PRODUCT_NAME: Apex Location Director
        PRODUCT_BUNDLE_IDENTIFIER: com.lukeeidson.apexlocation.mac
        # Ad-hoc signed so it can be zipped and shared without a paid account.
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        # usbmuxd's socket is outside any sandbox container.
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
        SWIFT_OBJC_BRIDGING_HEADER: ApexLocation/Bridging-Header.h
        HEADER_SEARCH_PATHS: $(SRCROOT)/../apex-core/include
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/../apex-core/target/universal-macos
        OTHER_LDFLAGS: [-lapex_core, -framework, Security, -framework, SystemConfiguration]
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ARCHS: [arm64, x86_64]
        ONLY_ACTIVE_ARCH: NO
    preBuildScripts:
      - name: Build apex-core (Rust, universal)
        basedOnDependencyAnalysis: false
        script: |
          export PATH="/opt/homebrew/opt/rustup/bin:$HOME/.cargo/bin:$PATH"
          cd "$SRCROOT/../apex-core"
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            MACOSX_DEPLOYMENT_TARGET=14.0 cargo build --release --lib --target $t || exit 1
          done
          mkdir -p target/universal-macos
          lipo -create target/aarch64-apple-darwin/release/libapex_core.a target/x86_64-apple-darwin/release/libapex_core.a -output target/universal-macos/libapex_core.a
